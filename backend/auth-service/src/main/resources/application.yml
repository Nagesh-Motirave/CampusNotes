server:
  port: ${PORT:8081}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain

jwt:
  secret: ${JWT_SECRET:campus-notes-hub-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration: 86400000 # 24 hours in ms

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_notes_hub_users}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true