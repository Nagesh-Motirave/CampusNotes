server:
  port: ${PORT:8081}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain

jwt:
  secret: ${JWT_SECRET:campus-notes-hub-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration: 86400000 # 24 hours in ms

resend:
  api-key: ${RESEND_API_KEY:${RESEND_KEY:${RESEND_APIKEY:}}}
  from-email: ${RESEND_FROM_EMAIL:${FROM_EMAIL:${MAIL_FROM:onboarding@resend.dev}}}

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_notes_hub_users}
  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:${SMTP_HOST:smtp.gmail.com}}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:${SMTP_PORT:587}}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:${SMTP_USERNAME:${SMTP_USER:${EMAIL_USER:${MAIL_USER:}}}}}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:${SMTP_PASSWORD:${SMTP_PASS:${EMAIL_PASSWORD:${EMAIL_PASS:${MAIL_PASS:}}}}}}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            protocols: TLSv1.2 TLSv1.3
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000