server:
  port: ${PORT:8082}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain

spring:
  application:
    name: notes-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_notes_hub_notes}

user-service:
  url: ${USER_SERVICE_URL:http://localhost:8083}

# Resend transactional email API configuration
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}

# Frontend URL for building links in notification emails
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}
