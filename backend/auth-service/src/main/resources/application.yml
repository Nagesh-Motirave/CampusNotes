server:
  port: ${PORT:8081}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: application/json,text/html,text/plain

jwt:
  secret: ${JWT_SECRET:campus-notes-hub-secret-key-that-is-at-least-256-bits-long-for-hs256}
  expiration: 86400000 # 24 hours in ms

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/campus_notes_hub_users}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
